name: Domeneshop FTP

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to live salesman.no (overwrites matching files; never deletes)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: domeneshop-production
  cancel-in-progress: false

jobs:
  web-deploy:
    name: Preview or upload via FTP with TLS
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Preview or upload files over FTP with TLS
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          PUBLISH_APPROVED: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$PUBLISH_APPROVED" == "true" ]]; then
            args+=(--publish)
          fi
          python3 .github/scripts/deploy_ftp.py "${args[@]}"
